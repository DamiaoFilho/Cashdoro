name: cashdoro

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: cashdoro
      POSTGRES_PASSWORD: cashdoro
      POSTGRES_DB: cashdoro
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashdoro -d cashdoro"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
